<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNS Paint</title>
<script>window.__errs = []; window.onerror = function (m, s, l, c) { window.__errs.push(m + ' @' + s + ':' + l + ':' + c); return false; };</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh; padding: 12px 14px 16px;
    background: #17181b;
    background: linear-gradient(180deg, #1b1d21 0%, #141518 100%);
    color: #d7d9de;
    font: 13px/1.4 "Segoe UI", Tahoma, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .app { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

  /* ---------- верхняя полоса ---------- */
  .top {
    display: flex; align-items: baseline; gap: 12px; padding: 2px 4px 0;
  }
  .brand { font-size: 15.5px; font-weight: 700; letter-spacing: .3px; color: #f2f3f6; white-space: nowrap; }
  .tagline { font-size: 11.5px; color: #8f939c; white-space: nowrap; }
  .top .keys { margin-left: auto; font-size: 10.5px; color: #6c707a; white-space: nowrap; }
  .top .keys b { color: #a6aab3; font-weight: 600; }

  /* ---------- рабочая зона: док инструментов + сцена + цвет ---------- */
  .main { display: flex; gap: 10px; align-items: stretch; }

  /* --- док инструментов (колонка слева, как в Krita / Ibis) --- */
  .dock {
    flex: 0 0 50px; display: flex; flex-direction: column; gap: 5px; align-items: stretch;
    background: #212328; border: 1px solid #35373d; border-radius: 10px; padding: 6px 5px;
  }
  .tbtn, .dbtn {
    height: 38px; border: 1px solid transparent; border-radius: 8px; background: transparent;
    color: #b9bcc4; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: .12s; padding: 0;
  }
  .tbtn:hover, .dbtn:hover:not(:disabled) { background: #2c2e34; color: #f0f1f4; }
  .tbtn.active { background: #f5a94b; color: #191a1e; }
  .tbtn svg, .dbtn svg { width: 19px; height: 19px; }
  .dbtn:disabled { opacity: .28; cursor: default; }
  .dock .div { height: 1px; background: #35373d; margin: 4px 3px; }

  /* --- центр: панель кисти над полотном + сцена --- */
  .center { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .brushbar {
    background: #212328; border: 1px solid #35373d; border-radius: 10px; padding: 8px 12px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .btypes { display: flex; gap: 5px; }
  .bbtn {
    width: 52px; height: 42px; border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: #b9bcc4; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: .12s; padding: 0;
  }
  .bbtn:hover { background: #2c2e34; color: #f0f1f4; }
  .bbtn.active { border-color: #f5a94b; background: rgba(245,169,75,.12); color: #ffd9a3; }
  .bbtn svg { width: 17px; height: 17px; }
  .bbtn span { font-size: 8.5px; letter-spacing: .2px; }

  .bdiv { width: 1px; align-self: stretch; background: #35373d; }

  .penopt {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    color: #8f939c; white-space: nowrap; user-select: none; -webkit-user-select: none;
  }
  .penopt:hover { color: #d7d9de; }
  .penopt input { accent-color: #f5a94b; width: 14px; height: 14px; cursor: pointer; margin: 0; }

  .sliders {
    display: flex; align-items: center; gap: 10px;
    flex: 1 1 320px; flex-wrap: wrap; row-gap: 8px; min-width: 280px;
  }
  .sgrp { display: flex; align-items: center; gap: 7px; flex: 1 1 118px; min-width: 118px; }
  .sgrp .lab { font-size: 9.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #8f939c; white-space: nowrap; }
  .sgrp input[type=range] { flex: 1 1 44px; min-width: 44px; accent-color: #f5a94b; }
  .sgrp .val { min-width: 26px; text-align: right; color: #b8bac0; font-variant-numeric: tabular-nums; font-size: 11px; }
  .btypes, .bdiv, #brushPrev, .penopt { flex: 0 0 auto; }
  #brushPrev {
    width: 42px; height: 42px; border-radius: 8px; flex: 0 0 auto;
    background: #17181b; border: 1px solid #3b3d44;
  }

  /* --- сцена с котом --- */
  .stage {
    position: relative; align-self: flex-start;
    padding: 9px; border-radius: 10px;
    background: repeating-conic-gradient(#26282d 0% 25%, #2d3036 0% 50%) 0 0 / 18px 18px;
    border: 1px solid #35373d;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  #work { display: block; width: 600px; height: 400px; max-width: 100%; cursor: crosshair; touch-action: none; border-radius: 4px; }
  .stage .hint {
    position: absolute; left: 11px; bottom: 4px; color: #696c75; font-size: 10.5px;
    pointer-events: none; user-select: none;
  }

  /* --- панель цвета --- */
  .side {
    flex: 0 0 262px; display: flex; flex-direction: column; gap: 9px;
    background: #212328; border: 1px solid #35373d; border-radius: 10px; padding: 11px;
  }
  .section { display: flex; flex-direction: column; gap: 7px; }
  .section + .section { border-top: 1px solid #2e3036; padding-top: 9px; }
  .cap { font-size: 9.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #8f939c; }
  .oprow { display: flex; align-items: center; gap: 9px; }
  .oprow .cap { min-width: 86px; }

  .currow { display: flex; gap: 8px; align-items: center; }
  .chip { width: 27px; height: 27px; border-radius: 7px; border: 1px solid rgba(255,255,255,.14); cursor: pointer; }
  #curColor { box-shadow: 0 0 0 2px rgba(245,169,75,.55); }
  .chip:hover { border-color: rgba(255,255,255,.35); }
  .hexwrap { flex: 1; display: flex; gap: 6px; align-items: center; }
  #hexIn {
    width: 82px; background: #17181b; color: #eef0f3; border: 1px solid #3b3d44;
    border-radius: 7px; padding: 5px 8px; font: 11.5px Consolas, Menlo, monospace;
  }
  #hexIn:focus { outline: 1px solid #f5a94b; }

  #svSquare, #hueBar { border-radius: 7px; cursor: crosshair; touch-action: none; border: 1px solid #3b3d44; width: 100%; }
  .picker { display: flex; flex-direction: column; gap: 6px; }
  #svSquare { height: 92px; }
  #hueBar { height: 12px; }

  .ptabs { display: flex; gap: 4px; margin: 2px 0; }
  .ptab {
    flex: 1; height: 25px; border: 1px solid #3b3d44; border-radius: 7px;
    background: #1b1c20; color: #a0a3ab; font-size: 11px; cursor: pointer;
    transition: .12s; padding: 0;
  }
  .ptab:hover { background: #2c2e34; color: #f0f1f4; }
  .ptab.active { background: rgba(245,169,75,.14); border-color: #f5a94b; color: #ffd9a3; font-weight: 700; }
  .ppane { display: flex; flex-direction: column; gap: 6px; }
  /* атрибут hidden перебивается display:flex (классика) — панель,
     выключенная табом, обязана исчезать, иначе CatWar-палитры
     оставались на экране при возврате на «Свой» */
  .ppane[hidden] { display: none !important; }
  #paneCW { max-height: 176px; overflow-y: auto; padding-right: 4px; }

  .cwgrp { display: flex; flex-direction: column; gap: 4px; }
  .cwgrp .glab { font-size: 9px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: #83868f; }
  .cwrow { display: flex; flex-wrap: wrap; gap: 4px; }
  .cw {
    width: 19px; height: 19px; border-radius: 5px; border: 1px solid rgba(0,0,0,.4);
    cursor: pointer; padding: 0; transition: .12s;
  }
  .cw:hover { transform: scale(1.18); }
  .cw.active { outline: 2px solid #f5a94b; outline-offset: 1px; }

  .histrow { display: flex; flex-wrap: wrap; gap: 4px; min-height: 17px; }
  .histrow .sw {
    width: 16px; height: 16px; border-radius: 5px;
    border: 1px solid rgba(0,0,0,.35); cursor: pointer; padding: 0; transition: .12s;
  }
  .sw:hover { transform: translateY(-1px); }
  .sw.active { outline: 2px solid #f5a94b; outline-offset: 1px; }
  .swempty { font-size: 10px; color: #62656e; }

  /* --- слои --- */
  .lylst { display: flex; flex-direction: column; gap: 4px; }
  .lrow {
    display: flex; align-items: center; gap: 6px; min-height: 30px;
    padding: 2px 6px; border: 1px solid #3b3d44; border-radius: 7px;
    background: #1b1c20; cursor: pointer; transition: .12s;
  }
  .lrow:hover { background: #23252b; }
  .lrow.active { border-color: #f5a94b; background: rgba(245,169,75,.12); }
  .lrow .lname { flex: 1; font-size: 11.5px; color: #d7d9de; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow.off .lname { color: #6c707a; text-decoration: line-through; }
  .lye {
    width: 26px; height: 26px; flex: 0 0 auto; border: none; background: transparent;
    color: #b9bcc4; cursor: pointer; border-radius: 6px; display: flex;
    align-items: center; justify-content: center; padding: 0;
  }
  .lye:hover { background: #2c2e34; color: #fff; }
  .lye svg { width: 15px; height: 15px; }
  /* мини-предпросмотр слоя: сам кот-контент на шахматке прозрачности */
  .lyth {
    flex: 0 0 auto; width: 42px; height: 28px; border-radius: 4px;
    border: 1px solid #3b3d44; pointer-events: none;
    background: repeating-conic-gradient(#26282e 0 25%, #1d1f24 0 50%) 0 0 / 8px 8px;
  }
  .lrow.off .lyth { opacity: .45; }
  .loprow select.lmode {
    flex: 1 1 0; min-width: 0; height: 26px; border-radius: 7px;
    border: 1px solid #3b3d44; background: #1b1c20; color: #d7d9de;
    font-size: 11.5px; padding: 0 4px; cursor: pointer;
  }
  .lyctl { display: flex; gap: 5px; }
  .lybtn {
    flex: 1; height: 30px; border-radius: 7px; border: 1px solid #3b3d44;
    background: #1b1c20; color: #d7d9de; font-size: 13px; cursor: pointer;
    transition: .12s; padding: 0; line-height: 1;
  }
  .lybtn:hover:not(:disabled) { background: #2c2e34; color: #fff; }
  .lybtn:disabled { opacity: .28; cursor: default; }
  .lybtn.danger:hover:not(:disabled) { background: rgba(226,85,79,.16); color: #ffb4b4; border-color: rgba(226,85,79,.4); }
  .loprow { display: flex; align-items: center; gap: 8px; }
  .loprow .cap { min-width: 74px; }
  .loprow input[type=range] { flex: 1 1 0; min-width: 40px; accent-color: #f5a94b; }
  .loprow .val { min-width: 30px; text-align: right; color: #b8bac0; font-size: 11px; font-variant-numeric: tabular-nums; }

  .acts { display: flex; gap: 6px; }
  .abtn {
    flex: 1; height: 32px; border-radius: 8px; border: 1px solid #3b3d44;
    background: #1b1c20; color: #d7d9de; font-size: 12px; cursor: pointer; transition: .12s;
  }
  .abtn:hover:not(:disabled) { background: #2c2e34; color: #fff; }
  .abtn:disabled { opacity: .3; cursor: default; }
  .abtn.danger:hover:not(:disabled) { background: rgba(226,85,79,.16); color: #ffb4b4; border-color: rgba(226,85,79,.4); }
  .gbtn {
    flex: 2; height: 32px; border-radius: 8px; border: none; cursor: pointer; padding: 0 10px;
    background: linear-gradient(135deg, #f5a94b 0%, #e08a2e 100%); color: #191a1e; font-weight: 700; font-size: 12px;
    transition: .12s; box-shadow: none; white-space: nowrap;
  }
  .gbtn:hover { filter: brightness(1.08); }
  .exp { display: flex; gap: 6px; }
  .exp + .exp { margin-top: 6px; }
  .exp .abtn { flex: 1; }
  #toast {
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-10px);
    max-width: 440px; padding: 9px 14px; border-radius: 9px; z-index: 50;
    background: #23252b; border: 1px solid #f5a94b; color: #ffe9c9;
    font-size: 12.5px; line-height: 1.45; box-shadow: 0 8px 26px rgba(0,0,0,.55);
    opacity: 0; pointer-events: none; transition: .18s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* --- мобильная/узкая вёрстка --- */
  @media (max-width: 1040px) {
    .main { flex-direction: column; }
    .dock { flex-direction: row; flex: 0 0 auto; align-self: flex-start; }
    .dock .div { height: auto; width: 1px; margin: 3px 4px; }
    .side { flex: 1 1 auto; }
    #work { width: 100%; height: auto; }
    /* подсказка про Ctrl+Z не нужна там, где нет клавиатуры */
    .top .keys { display: none; }
    .brand + .tagline { font-size: 10px; }
  }
  @media (max-width: 620px) {
    body { padding: 8px 8px 12px; }
    .top { gap: 8px; }
    .tagline { font-size: 9.5px; }
    .brushbar { padding: 7px 8px; gap: 8px; }
    .bbtn { width: 47px; height: 44px; }
    .tbtn, .dbtn { width: 43px; height: 43px; }
    .ptab { height: 32px; font-size: 12px; }
    .abtn, .gbtn { height: 38px; font-size: 12.5px; }
    .lybtn { height: 36px; }
    .lye { width: 30px; height: 30px; }
    .lrow { min-height: 36px; }
    input[type=range] { min-height: 26px; }
  }
  /* тач: без серых вспышек тапа и pull-to-refresh посреди рисования */
  button, .lrow, .ptab { -webkit-tap-highlight-color: transparent; }
  body { overscroll-behavior-y: contain; }
  /* тач-цели: двойной тап по кнопке не зумит страницу, лонг-пресс по канве
     не зовёт контекстное меню iOS и не выделяет «текст» */
  button, .ptab, .lrow, .lrow .lye, .histRow, .cwitem, .abtn, .gbtn,
  .lybtn, .dbtn, .tbtn, .bbtn { touch-action: manipulation; }
  body, .app, #work, #svSquare, #hueBar {
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }

  #selftest {
    display: none; margin: 0 auto; max-width: 1280px; padding: 10px 14px;
    background: #121317; border: 1px solid #35373d; border-radius: 10px;
    color: #b9e3a0; font: 12px/1.6 Consolas, Menlo, monospace; white-space: pre-wrap;
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">&#128062; KNS Paint</div>
    <div class="tagline">краска не выходит за кота · контур всегда поверх рисунка</div>
    <div class="keys"><b>1–4</b> инструменты · <b>B</b> сменить кисть · <b>Ctrl+Z</b> отмена</div>
  </header>

  <div class="main">
    <nav class="dock" title="Инструменты">
      <button type="button" class="tbtn active" id="toolBrush" title="Кисть (1) — крась по коту, за края не выйдет">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg>
      </button>
      <button type="button" class="tbtn" id="toolEraser" title="Ластик (2) — стирает твою краску, кот и контур остаются">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8.5l-5.2-5.2a1.5 1.5 0 0 1 0-2.1l9.4-9.4a1.5 1.5 0 0 1 2.1 0l4.9 4.9a1.5 1.5 0 0 1 0 2.1L13 19"/><path d="M9.4 8.6l6 6"/></svg>
      </button>
      <button type="button" class="tbtn" id="toolFill" title="Заливка (3) — заливает схожую область, останавливается на контуре">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11L12.3 4.3a1 1 0 0 0-1.4 0l-8 8a1 1 0 0 0 0 1.4l5.6 5.6c.4.4 1 .4 1.4 0l8.1-8.1a1 1 0 0 0 0-1.3z"/><path d="M4.5 13.5l6-6"/><path d="M20.5 16.5c0 1.4-1.1 2.5-2.3 2.5s-2.2-1.1-2.2-2.5c0-1 1.3-2.8 2.2-4 1 1.2 2.3 3 2.3 4z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button type="button" class="tbtn" id="toolPicker" title="Пипетка (4) — взять цвет с картинки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 6.5l-6.1 6.1a2 2 0 0 0-.5 1l-.8 3 3-.8a2 2 0 0 0 1-.5l6.1-6.1"/><path d="M12.6 4.4l2.6-2.6a2.1 2.1 0 0 1 3 0l3.9 3.9a2.1 2.1 0 0 1 0 3l-2.6 2.6"/><path d="M9.5 9.5l5 5"/><path d="M12.6 4.4l6.9 6.9"/></svg>
      </button>
      <div class="div"></div>
      <button type="button" class="dbtn" id="btnUndo" title="Отменить (Ctrl/Cmd+Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5L3 10l5 5"/><path d="M3 10h11a6 6 0 0 1 6 6v3"/></svg>
      </button>
      <button type="button" class="dbtn" id="btnRedo" title="Вернуть (Ctrl/Cmd+Shift+Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5l5 5-5 5"/><path d="M21 10H10a6 6 0 0 0-6 6v3"/></svg>
      </button>
    </nav>

    <div class="center">
      <div class="brushbar">
        <div class="btypes">
          <button type="button" class="bbtn active" id="brushRound" title="Круглая — мягкость края зависит от «жёсткости»">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="5.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="7.6" opacity=".4" stroke-width="2.4"/></svg>
            <span>круглая</span>
          </button>
          <button type="button" class="bbtn" id="brushFlat" title="Плоская — след поворачивается за движением">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M12 12l7.8-4.6" stroke-width="6" opacity=".9"/><path d="M12 12l-7.8 4.6" stroke-width="2.2" opacity=".45"/></svg>
            <span>плоская</span>
          </button>
          <button type="button" class="bbtn" id="brushPencil" title="Карандаш — тонкий зернистый след">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5l5 5L8 21H4v-4L14.5 4.5z"/><path d="M12.5 6.5l5 5"/></svg>
            <span>карандаш</span>
          </button>
          <button type="button" class="bbtn" id="brushSpray" title="Спрей — распылённые точки">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="9" cy="9" r="1.7"/><circle cx="15" cy="11" r="1.7"/><circle cx="11" cy="15" r="1.7"/><circle cx="7" cy="14" r="1.4"/><circle cx="14" cy="6" r="1.4"/><circle cx="17" cy="15.5" r="1.1"/><circle cx="10" cy="19" r="1.1"/></svg>
            <span>спрей</span>
          </button>
        </div>
        <div class="bdiv"></div>
        <div class="sliders">
          <div class="sgrp" title="Диаметр кисти в пикселях">
            <span class="lab">Размер</span>
            <input type="range" id="sizeRange" min="1" max="24" step="1" value="6" title="Размер кисти">
            <span class="val" id="sizeVal">6</span>
          </div>
          <canvas id="brushPrev" width="42" height="42" title="Как ложится кисть"></canvas>
          <div class="bdiv"></div>
          <div class="sgrp" title="Резкость края мазка">
            <span class="lab">Жёсткость</span>
            <input type="range" id="hardness" min="0" max="100" step="5" value="70" title="Жёсткость края">
            <span class="val" id="hardnessVal">70%</span>
          </div>
          <div class="sgrp" title="Прозрачность мазка">
            <span class="lab">Прозрачность</span>
            <input type="range" id="opacity" min="5" max="100" step="5" value="100" title="Прозрачность">
            <span class="val" id="opacityVal">100%</span>
          </div>
        </div>
        <div class="bdiv"></div>

<script src="paint-data.js"></script>
<script>
(function () {
'use strict';
/* ============================================================
   KNS Paint v8 — кисть по коту с контрактом:
   1) краска не выходит за силуэт кота И не плотнее скетча
      на АА-кромке (cap по альфе — нет артефактов у ушей/спины);
   2) контур кота (тёмные линии скетча) всегда ПОВЕРХ краски;
   3) кисти: круглая / плоская / карандаш / спрей,
      жёсткость края + компактный слайдер размера с превью;
   4) ластик стирает краску до базы, кот и контур не трогаются;
   5) seed штампов зависит только от позиции на пути — карандаш
      и спрей не «дёргаются» при движении курсора;
   6) цвет: таб «Свой» (HSV) и «CatWar» (палитры окрасов CatWar);
   7) импорт проекта: PNG «слой краски» 300×200 — REPLACE краски
      АКТИВНОГО слоя, один undo-шаг на весь импорт, клип по
      силуэту и кап по альфе скетча; «картинка кота» распознаётся
      и отклоняется с тостом;
   8) экспорт «для игры»: композит, кроп по bbox силуэта скетча,
      паддинг 2px слева/сверху/справа, снизу 0 — опора лап у кромки;
   9) СЛОИ: стек краски — новый/удалить/переставить/слить с нижним/
      сила слоя/глаз видимости/РЕЖИМ НАЛОЖЕНИЯ (16 режимов: обычный/
      умножение/экран/перекрытие/…); рисование в активный; undo хранит
      пиксельные шаги (по слою) и структурные (живые canvas-ссылки);
      persist v2 пишет все слои (с режимом); «слой окраса» = сплющенные
      видимые; в списке слоёв — ЖИВОЙ МИНИ-ПРЕДПРОСМОТР каждого слоя;
  10) мобильные: тач-рисование (pointer events + touch-action), цели
      нажатия крупнее, вёрстка колонкой до узких экранов;
  11) хоткеи по ФИЗИЧЕСКОМУ коду клавиши — ру-раскладка (z→я)
      не отключает Ctrl+Z; табы палитр честно прячут панель.
   ============================================================ */

var D = window.PAINT_DATA || (typeof PAINT_DATA !== 'undefined' ? PAINT_DATA : null);
var W = D.meta.w, H = D.meta.h;
var KEY = 'kns_paint_state_v4';

function $(id) { return document.getElementById(id); }
function mkCv() { var c = document.createElement('canvas'); c.width = W; c.height = H; return c; }
function ctx2d(c) { return c.getContext('2d', { willReadFrequently: true }); }
function hexRGB(hex) {
  var m = /^#?([0-9a-fA-F]{6})$/.exec(hex);
  if (!m) return null;
  var v = parseInt(m[1], 16);
  return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
}
function rgbHex(r, g, b) {
  function u(x) { return (x < 16 ? '0' : '') + Math.round(x).toString(16); }
  return '#' + u(r) + u(g) + u(b);
}
function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  var h = 0;
  if (d > 0) {
    if (mx === r) h = 60 * (((g - b) / d) % 6);
    else if (mx === g) h = 60 * ((b - r) / d + 2);
    else h = 60 * ((r - g) / d + 4);
  }
  if (h < 0) h += 360;
  return { h: h, s: mx === 0 ? 0 : d / mx, v: mx };
}
function hsv2rgb(h, s, v) {
  var c = v * s, hh = (((h % 360) + 360) % 360) / 60, x = c * (1 - Math.abs(hh % 2 - 1)), m = v - c;
  var r = 0, g = 0, b = 0;
  if (hh < 1) { r = c; g = x; }
  else if (hh < 2) { r = x; g = c; }
  else if (hh < 3) { g = c; b = x; }
  else if (hh < 4) { g = x; b = c; }
  else if (hh < 5) { r = x; b = c; }
  else { r = c; b = x; }
  return { r: (r + m) * 255, g: (g + m) * 255, b: (b + m) * 255 };
}

/* ---------- состояние ---------- */
var state = {
  tool: 'brush',          /* brush | eraser | fill | picker */
  brush: 'round',         /* round | flat | pencil | spray */
  size: 6,                /* диаметр кисти, арт-px */
  hardness: 70,           /* 0 мягкая кромка .. 100 резкая */
  opacity: 100,
  penPress: true,         /* перо: толщина мазка от нажима (давление 0..1) */
  color: '#f5e5ce',
  prevColor: '#828a8f'
};
var history = [];
var HIST_MAX = 18;

/* ---------- канвасы ---------- */
var baseCv = mkCv(), liveCv = mkCv(), lineCv = mkCv(), tmpCv = mkCv();
var bctx = ctx2d(baseCv), lctx = ctx2d(liveCv), linectx = ctx2d(lineCv), tctx = ctx2d(tmpCv);
var work = $('work'), wctx = ctx2d(work);

/* ---------- СЛОИ (порядок снизу вверх) ----------
   Каждый слой — свой канвас W×H. Инструменты рисуют в АКТИВНЫЙ слой:
   paintCv/pctx — алиасы его канваса/контекста, смена слоя меняет алиасы,
   пиксели не копируются. Композит идёт по массиву layers с силой слоя. */
var layers = [], activeLy = 0, layerSeq = 0;
function mkLayer() {
  var cv = mkCv();
  layerSeq++;
  return {
    id: layerSeq, name: 'Слой ' + layerSeq, visible: true, opacity: 1,
    mode: 'source-over', cv: cv, ctx: ctx2d(cv)
  };
}
layers.push(mkLayer());
var paintCv = layers[0].cv, pctx = layers[0].ctx;
function syncActiveAlias() {
  paintCv = layers[activeLy].cv;
  pctx = layers[activeLy].ctx;
}

/* ---------- ассеты ---------- */
var assets = { base: new Image() };
assets.base.src = D.base;
var baseImageData = null, silArr = null, darkArr = null, alphaCap = null;

function buildBase() {
  bctx.drawImage(assets.base, 0, 0, W, H);
  baseImageData = bctx.getImageData(0, 0, W, H);
  var n = W * H, bd = baseImageData.data;
  silArr = new Uint8Array(n); darkArr = new Uint8Array(n); alphaCap = new Uint8Array(n);
  /* lineCv — контур (тёмные линии скетча), рисуется ПОВЕРХ краски в композите */
  var li = linectx.createImageData(W, H), ld = li.data;
  for (var i = 0; i < n; i++) {
    var o = i * 4;
    if (bd[o + 3] > 0) silArr[i] = 1;
    /* АА-кромка: плотность краски ограничена альфой скетча — за визуальный
       край кота краска не вылезает (артефакты у ушей/спины), кромка смягчается */
    alphaCap[i] = bd[o + 3];
    var avg = (bd[o] + bd[o + 1] + bd[o + 2]) / 3;
    if (bd[o + 3] > 200 && avg < 90) darkArr[i] = 1;
    if (darkArr[i]) {
      ld[o] = bd[o]; ld[o + 1] = bd[o + 1]; ld[o + 2] = bd[o + 2]; ld[o + 3] = bd[o + 3];
    }
  }
  linectx.putImageData(li, 0, 0);
}

/* ---------- композит: скетч → слои краски (сила/видимость) → контур поверх ---------- */
function paintLayer() {
  /* живой ластик: краска АКТИВНОГО слоя минус маска стирания */
  tctx.globalCompositeOperation = 'source-over';
  tctx.clearRect(0, 0, W, H);
  tctx.drawImage(paintCv, 0, 0);
  tctx.globalCompositeOperation = 'destination-out';
  tctx.globalAlpha = liveStroke.alpha;
  tctx.drawImage(liveCv, 0, 0);
  tctx.globalAlpha = 1;
  tctx.globalCompositeOperation = 'source-over';
  return tmpCv;
}
function composite() {
  wctx.clearRect(0, 0, W, H);
  wctx.drawImage(baseCv, 0, 0);
  for (var i = 0; i < layers.length; i++) {
    var L = layers[i];
    if (!L.visible) continue;
    wctx.globalAlpha = L.opacity;
    /* режим наложения слоя (normal/multiply/screen/overlay/...). Покрытую
       краской часть кота слой «смешивает» с тем, что под ним (базовый скетч
       или нижние слои); свои прозрачные px не влияют — Porter-Duff;
       живой мазок/ластик идут с тем же режимом, как предпросмотр в Krita */
    wctx.globalCompositeOperation = L.mode || 'source-over';
    if (i === activeLy && liveStroke && liveStroke.erase) {
      wctx.drawImage(paintLayer(), 0, 0);
    } else {
      wctx.drawImage(L.cv, 0, 0);
      if (i === activeLy && liveStroke) {
        /* живой мазок активного слоя — с силой этого слоя */
        wctx.globalAlpha = L.opacity * liveStroke.alpha;
        wctx.drawImage(liveCv, 0, 0);
      }
    }
    wctx.globalAlpha = 1;
    wctx.globalCompositeOperation = 'source-over';
  }
  wctx.drawImage(lineCv, 0, 0);   /* контур всегда поверх */
}

/* ---------- undo/redo ----------
   Два вида шагов: 'px' — пиксели одного слоя (мазок/заливка/импорт),
   'st' — структура слоёв (добавить/удалить/порядок/сила/видимость/стереть
   всё): канвасы в снапшоте — живые ссылки, пиксели не копируются. */
var undoStack = [], redoStack = [], MAX_UNDO = 120;
function paintSnapshot() { return pctx.getImageData(0, 0, W, H); }
function layerMeta() {
  return layers.map(function (L) {
    return { id: L.id, name: L.name, visible: L.visible, opacity: L.opacity, mode: L.mode, cv: L.cv };
  });
}
function structSnap() { return { t: 'st', layers: layerMeta(), active: activeLy }; }
function applyStruct(e) {
  layers = e.layers.map(function (m) {
    return {
      id: m.id, name: m.name, visible: m.visible, opacity: m.opacity,
      mode: (m.mode && isLayerMode(m.mode)) ? m.mode : 'source-over',
      cv: m.cv, ctx: ctx2d(m.cv)
    };
  });
  activeLy = Math.max(0, Math.min(layers.length - 1, e.active));
  syncActiveAlias(); renderLayers();
}
function snapPx(cv) { return cv.getContext('2d').getImageData(0, 0, W, H); }
function pushUndo() {
  undoStack.push({ t: 'px', cv: paintCv, img: pctx.getImageData(0, 0, W, H) });
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack.length = 0;
  updateUndoUI();
}
function pushStructUndo() {
  undoStack.push(structSnap());
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack.length = 0;
  updateUndoUI();
}
function undoRedoDo(popStack, pushStack) {
  if (!popStack.length) return false;
  var e = popStack.pop();
  if (e.t === 'px') {
    pushStack.push({ t: 'px', cv: e.cv, img: snapPx(e.cv) });
    e.cv.getContext('2d').putImageData(e.img, 0, 0);
    renderLayers();          /* мини-кадры: пиксели вернулись — обновить */
  } else {
    pushStack.push(structSnap());
    applyStruct(e);
  }
  composite(); schedulePersist(); updateUndoUI();
  return true;
}
function doUndo() { return undoRedoDo(undoStack, redoStack); }
function doRedo() { return undoRedoDo(redoStack, undoStack); }
function updateUndoUI() {
  $('btnUndo').disabled = undoStack.length === 0;
  $('btnRedo').disabled = redoStack.length === 0;
}
function clearPaint() {
  pushStructUndo();
  for (var i = 0; i < layers.length; i++) layers[i].ctx.clearRect(0, 0, W, H);
  composite(); schedulePersist(); renderLayers();
}

/* ---------- штампы: px-перечисление с MAX-альфой ---------- */
function profA(t, hard01) {
  /* профиль края: t∈[0..1]; внутри ядра (t<=hr) — 255, дальше линейный спад */
  var hr = Math.min(hard01, 0.98);
  if (t <= hr) return 255;
  var a = 255 * (1 - t) / (1 - hr + 0.02);
  return a > 255 ? 255 : a;
}
function frac(x) { return x - Math.floor(x); }
function hashF(seed, salt) {
  var v = Math.sin(seed * 127.1 + salt * 311.7) * 43758.5453;
  return frac(Math.abs(v));
}

/* круглый штамп: r — радиус, hard — жёсткость 0..1; nocap — ластик (без АА-капа) */
function stampRound(uA, x, y, r, hard, nocap) {
  var x0 = Math.max(0, Math.floor(x - r)), x1 = Math.min(W - 1, Math.ceil(x + r));
  var y0 = Math.max(0, Math.floor(y - r)), y1 = Math.min(H - 1, Math.ceil(y + r));
  var r2 = r * r, stepI = 1 / r;
  for (var py = y0; py <= y1; py++) {
    var rowW = py * W;
    for (var px = x0; px <= x1; px++) {
      var dx = px - x, dy = py - y, d2 = dx * dx + dy * dy;
      if (d2 > r2) continue;
      var i = rowW + px;
      var cap = alphaCap[i];
      if (!cap) continue;                   /* КЛИП по силуэту кота */
      var t = Math.sqrt(d2) * stepI;
      var a = profA(t, hard);
      if (!nocap && a > cap) a = cap;        /* АА-кромка: не плотней скетча (кроме ластика) */
      if (a > uA[i]) uA[i] = a;
    }
  }
}
/* плоский штамп-эллипс вдоль ang (направление движения в радианах) */
function stampFlat(uA, x, y, r, hard, ang, nocap) {
  var rb = Math.max(0.8, r * 0.42);           /* малая полуось */
  var x0 = Math.max(0, Math.floor(x - r)), x1 = Math.min(W - 1, Math.ceil(x + r));
  var y0 = Math.max(0, Math.floor(y - rb)), y1 = Math.min(H - 1, Math.ceil(y + rb));
  var ca = Math.cos(ang), sa = Math.sin(ang);
  for (var py = y0; py <= y1; py++) {
    var rowW = py * W;
    for (var px = x0; px <= x1; px++) {
      var i = rowW + px;
      var cap = alphaCap[i];
      if (!cap) continue;
      var dx = px - x, dy = py - y;
      var along = dx * ca + dy * sa;           /* вдоль мазка */
      var across = -dx * sa + dy * ca;         /* поперёк */
      var t = Math.max(Math.abs(along) / r, Math.abs(across) / rb);
      if (t > 1) continue;
      var a = profA(t, hard);
      if (!nocap && a > cap) a = cap;
      if (a > uA[i]) uA[i] = a;
    }
  }
}
/* карандаш: тонкое твёрдое ядро с зернистостью (джиттер детерминирован) */
function stampPencil(uA, x, y, r, seed, nocap) {
  var re = Math.max(0.7, r * 0.32);
  var jx = (hashF(seed, 1) - 0.5) * re * 1.2;
  var jy = (hashF(seed, 2) - 0.5) * re * 1.2;
  var cx = x + jx, cy = y + jy;
  var x0 = Math.max(0, Math.floor(cx - re)), x1 = Math.min(W - 1, Math.ceil(cx + re));
  var y0 = Math.max(0, Math.floor(cy - re)), y1 = Math.min(H - 1, Math.ceil(cy + re));
  var r2 = re * re;
  for (var py = y0; py <= y1; py++) {
    var rowW = py * W;
    for (var px = x0; px <= x1; px++) {
      var dx = px - cx, dy = py - cy, d2 = dx * dx + dy * dy;
      if (d2 > r2) continue;
      var i = rowW + px;
      var cap = alphaCap[i];
      if (!cap) continue;
      var t = Math.sqrt(d2) / re;
      var a = profA(Math.min(1, t * 0.9), 0.85);  /* почти резкое ядро */
      if (!nocap && a > cap) a = cap;
      if (a > uA[i]) uA[i] = a;
    }
  }
}
/* спрей: распылённые точки по кругу; плотность растёт от seed-ошумления */
function stampSpray(uA, x, y, r, seed, nocap) {
  var n = Math.max(3, Math.round(r * r * 0.28));
  for (var k = 0; k < n; k++) {
    var ang = hashF(seed + k, 3) * Math.PI * 2;
    var dist = Math.sqrt(hashF(seed + k, 4)) * r * 0.98;
    var sx = Math.round(x + Math.cos(ang) * dist);
    var sy = Math.round(y + Math.sin(ang) * dist);
    if (sx < 0 || sy < 0 || sx >= W || sy >= H) continue;
    var i = sy * W + sx;
    if (!alphaCap[i]) continue;
    if (uA[i] < 170) uA[i] = nocap ? 255 : alphaCap[i];
  }
}

/* ---------- перо: масштаб радиуса от давления ----------
   0.18 — минимальный след при лёгком касании, кривая p^1.4 — как в
   графредакторах; мышь/touch и выключенная опция дают полный радиус */
function ptPress(pt) { return (pt && typeof pt.p === 'number') ? pt.p : 1; }
function penScale(o, pt) {
  if (!o.pena) return o.radius;
  var pv = Math.max(0, Math.min(1, ptPress(pt)));
  var sc = 0.18 + 0.82 * Math.pow(pv, 1.4);
  return Math.max(0.4, o.radius * sc);
}

/* ---------- живой мазок: путь штампов, per-px MAX-альфа ---------- */
var liveStroke = null;   /* { pts, erase, color, alpha, radius, hard, brush } */
var uA = new Uint8Array(W * H);
var liveImg = null;

function redrawLive() {

  /* отдельная peaked-функция края, повторяет profA */
  var type = state.brush;
  var r = state.size / 2, hr = Math.min(state.hardness / 100, 0.98);
  var op = state.opacity / 100;
  if (type === 'pencil') {

    prevCtx.fillStyle = c;
    prevCtx.globalAlpha = op * 0.92;
    prevCtx.beginPath();
    prevCtx.arc(cx + (hashF(77, 1) - 0.5) * re, cy + (hashF(77, 2) - 0.5) * re, Math.max(0.6, re * s), 0, Math.PI * 2);
    prevCtx.fill();
    prevCtx.globalAlpha = 1;
    return;
  }
  if (type === 'spray') {
    var rr = r * s;
    var n = Math.max(3, Math.round(r * r * 0.28));
    prevCtx.fillStyle = c;
    prevCtx.globalAlpha = op;
    for (var k = 0; k < n; k++) {
      var ang = hashF(77 + k, 3) * Math.PI * 2;
      var dist = Math.sqrt(hashF(77 + k, 4)) * rr * 0.98;
      prevCtx.beginPath();
      prevCtx.arc(cx + Math.cos(ang) * dist, cy + Math.sin(ang) * dist, 1.1, 0, Math.PI * 2);
      prevCtx.fill();
    }
    prevCtx.globalAlpha = 1;
    return;
  }
  var ell = type === 'flat';
  var rx = ell ? r * s : r * s;
  var ry = ell ? Math.max(0.8, r * 0.42) * s : r * s;
  var rot = ell ? -0.55 : 0;
  var g = prevCtx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, c);
  g.addColorStop(hr, c);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  prevCtx.save();
  prevCtx.translate(cx, cy);
  prevCtx.rotate(rot);
  prevCtx.globalAlpha = op;
  prevCtx.scale(ell ? rx / ry : 1, 1);
  prevCtx.fillStyle = g;
  prevCtx.beginPath();
  prevCtx.arc(0, 0, ell ? ry : Math.max(rx, ry), 0, Math.PI * 2);
  prevCtx.fill();

  prevCtx.globalAlpha = 1;
}

var hsv = { h: 34, s: 0.15, v: 0.96 };

/* давление пера: только pointerType pen/eraser несёт осмысленный 0..1;

    var pr = e.pressure;
    return (typeof pr === 'number' && pr > 0) ? Math.min(1, pr) : 0.5;

/* перевёрнутое перо = ластик (кончик-резинкой, как в Krita) */
var penFlip = false, penPrevTool = null;
var activePtr = null;
work.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (activePtr !== null) return;
  if (e.pointerType === 'eraser' && state.tool !== 'eraser') {
    penFlip = true;
    penPrevTool = state.tool;
    setTool('eraser');
  } else {
    penFlip = false;
  }
  var p = artPoint(e);
  if (state.tool === 'brush' || state.tool === 'eraser') {
    activePtr = e.pointerId;
    try { work.setPointerCapture(e.pointerId); } catch (err) { }
    liveBegin(p.x, p.y, penPr(e));
  } else if (state.tool === 'fill') {
    floodFillAt(Math.floor(p.x), Math.floor(p.y));

/* ---------- хоткеи: по ФИЗИЧЕСКОЙ клавише (e.code) ----------
   На русской раскладке e.key для Z — «я», для Y — «н»: матчинг по e.key
   молча убивал Ctrl+Z/Ctrl+Y/Ctrl+B. ev.code не зависит от раскладки. */
window.addEventListener('keydown', function (e) {
  var tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  var mod = e.ctrlKey || e.metaKey;
  var c = e.code || '';
  var numMatch = { Digit1: 'brush', Numpad1: 'brush', Digit2: 'eraser', Numpad2: 'eraser',
                   Digit3: 'fill', Numpad3: 'fill', Digit4: 'picker', Numpad4: 'picker' };
  if (mod && c === 'KeyZ') {
    e.preventDefault();
    if (e.shiftKey) doRedo(); else doUndo();
  } else if (mod && c === 'KeyY') {
    e.preventDefault();
    doRedo();
  } else if (!mod && numMatch[c]) {
    setTool(numMatch[c]);
  } else if (!mod && (c === 'KeyB')) {
    var cyc = ['round', 'flat', 'pencil', 'spray'];
    var cur = cyc.indexOf(state.brush);
    setBrush(cyc[(cur + 1) % cyc.length]);
  }
});

/* ---------- v8: импорт проекта (PNG «слой краски» 300×200) ---------- */
var IMPORT_MAX_BYTES = 4 * 1024 * 1024;
var NEED_MSG = 'нужен файл слоя краски из KNS Paint (300×200)';
function dataUrlB64(url) {
  var m = /^data:[^,]*;base64,(.*)$/.exec(String(url || ''));
  return m ? m[1] : null;
}
/* PNG-магия 89 50 4E 47 0D 0A 1A 0A по содержимому, не по mime-префиксу */
function pngMagicOk(b64) {
  var head;
  try { head = atob(b64.slice(0, 12)); } catch (e) { return false; }
  if (head.length < 8) return false;
  return head.charCodeAt(0) === 0x89 && head.charCodeAt(1) === 0x50 &&
    head.charCodeAt(2) === 0x4E && head.charCodeAt(3) === 0x47 &&
    head.charCodeAt(4) === 0x0D && head.charCodeAt(5) === 0x0A &&
    head.charCodeAt(6) === 0x1A && head.charCodeAt(7) === 0x0A;
}
/* детект «картинки кота» (экспорт work): у композита непрокрашенные
   пиксели твёрдого тела непрозрачны И равны базе; у слоя краски таких
   нет — непрокрашенное прозрачно. Калибровка на живой паре экспортов:
   слой 0 совпадений, композит 3632+ при заливке тела; порог 1200. */
var COMPOSITE_MIN_MATCH = 1200;
function compositeMatchCount(d) {
  var bd = baseImageData.data, n = W * H, match = 0, opaque = 0;
  for (var i = 0; i < n; i++) {
    if (alphaCap[i] < 250) continue;
    var o = i * 4;
    if (d[o + 3] < 250) continue;
    opaque++;
    if (Math.abs(d[o] - bd[o]) <= 6 && Math.abs(d[o + 1] - bd[o + 1]) <= 6 &&
      Math.abs(d[o + 2] - bd[o + 2]) <= 6) match++;
  }
  return { match: match, opaque: opaque };
}
/* REPLACE слоя краски, ОДИН undo-снапшот на весь импорт, клип по
   силуэту + кап по альфе скетча, штатный persist. Promise {ok, reason} */
function importLayer(dataURL) {
  return new Promise(function (resolve) {
    var bad = function (reason, msg) { toast(msg); resolve({ ok: false, reason: reason, msg: msg }); };
    var b64 = dataUrlB64(dataURL);
    if (!b64 || !pngMagicOk(b64)) { bad('magic', 'не PNG — ' + NEED_MSG); return; }
    if (b64.length * 3 / 4 > IMPORT_MAX_BYTES) { bad('big', 'файл больше 4 МБ — ' + NEED_MSG); return; }
    var img = new Image();
    img.onload = function () {
      if (img.naturalWidth !== W || img.naturalHeight !== H) { bad('dim', NEED_MSG); return; }
      var t = mkCv(), tc = ctx2d(t);
      tc.drawImage(img, 0, 0);
      var d = tc.getImageData(0, 0, W, H).data;
      var mc = compositeMatchCount(d);
      if (mc.match >= COMPOSITE_MIN_MATCH) {
        var cmsg = 'это картинка кота — для редактирования открой файл “слой краски”';
        toast(cmsg);
        resolve({ ok: false, reason: 'composite', msg: cmsg, match: mc.match });
        return;
      }
      pushUndo();
      var out = pctx.createImageData(W, H), od = out.data;
      for (var i = 0; i < W * H; i++) {
        var o = i * 4, a = d[o + 3];
        if (!alphaCap[i]) continue;          /* клип по силуэту кота */
        if (a > alphaCap[i]) a = alphaCap[i]; /* кап по альфе скетча */
        od[o] = d[o]; od[o + 1] = d[o + 1]; od[o + 2] = d[o + 2]; od[o + 3] = a;
      }
      pctx.clearRect(0, 0, W, H);
      pctx.putImageData(out, 0, 0);
      composite(); schedulePersist(); renderLayers();
      resolve({ ok: true, imported: true });
    };
    img.onerror = function () { bad('decode', 'файл не читается — ' + NEED_MSG); };
    img.src = dataURL;
  });
}
$('btnImpOpen').onclick = function () { $('fileImport').click(); };
$('fileImport').addEventListener('change', function () {
  var f = this.files && this.files[0];
  this.value = '';                      /* повторный выбор того же файла */
  if (!f) return;
  if (f.size > IMPORT_MAX_BYTES) { toast('файл больше 4 МБ — ' + NEED_MSG); return; }
  var fr = new FileReader();
  fr.onload = function () { importLayer(fr.result); };
  fr.onerror = function () { toast('файл не читается — ' + NEED_MSG); };
  fr.readAsDataURL(f);
});

  /* ST16: СЛОИ — два слоя, порядок/сила/видимость/удаление, undo структур,
     persist v2. Зелёный — верхний слой, красный — нижний, обе через (BODY+5). */
  var mark16 = undoStack.length;
  var A16 = snapWork();
  addLayerUI();                                    /* теперь слоёв 2, актив верхний */
  var twoOk16 = layers.length === 2 && activeLy === 1;
  strokeLine(BODY.x, BODY.y, BODY.x + 10, BODY.y, { size: 10, hardness: 100, color: '#00cc44', opacity: 100 });  /* зелёный — верхний */
  activateLayer(0);
  strokeLine(BODY.x + 2, BODY.y, BODY.x + 12, BODY.y, { size: 10, hardness: 100, color: '#cc2244', opacity: 100 }); /* красный — нижний */
  activateLayer(1);
  composite();
  var ov16 = (BODY.y * W + BODY.x + 5) * 4;       /* точка перекрытия мазков */
  var GREEN = [0, 204, 68], RED = [204, 34, 68];
  var cmp16 = snapWork().data;
  var topWin16 = Math.abs(cmp16[ov16] - GREEN[0]) <= 6 && Math.abs(cmp16[ov16 + 1] - GREEN[1]) <= 6 && Math.abs(cmp16[ov16 + 2] - GREEN[2]) <= 6;
  setLayerOpacity(1, 50);                         /* сила верхнего 50% */
  cmp16 = snapWork().data;
  var halfOk16 = Math.abs(cmp16[ov16] - (GREEN[0] + RED[0]) / 2) <= 8 &&
    Math.abs(cmp16[ov16 + 1] - (GREEN[1] + RED[1]) / 2) <= 8 &&
    Math.abs(cmp16[ov16 + 2] - (GREEN[2] + RED[2]) / 2) <= 8;
  setLayerOpacity(1, 100);
  setLayerVisible(1, false);                      /* верхний спрятан — виден красный */
  cmp16 = snapWork().data;
  var lowWin16 = Math.abs(cmp16[ov16] - RED[0]) <= 6 && Math.abs(cmp16[ov16 + 1] - RED[1]) <= 6 && Math.abs(cmp16[ov16 + 2] - RED[2]) <= 6;
  setLayerVisible(1, true);
  activateLayer(0);                              /* нижний — активный, порядок не меняю */
  moveLayerUI(1);
  cmp16 = snapWork().data;
  var swap16 = Math.abs(cmp16[ov16] - RED[0]) <= 6 && Math.abs(cmp16[ov16 + 1] - RED[1]) <= 6 && Math.abs(cmp16[ov16 + 2] - RED[2]) <= 6;
  moveLayerUI(-1);                                /* порядок обратно */
  activateLayer(1);
  var delOk16 = false, delUndo16 = false, nBefore16 = undoStack.length;
  delLayerUI();                                   /* удалить ВЕРХНИЙ (зелёный) */
  var one16 = layers.length === 1;
  cmp16 = snapWork().data;
  var onlyRed16 = Math.abs(cmp16[ov16] - RED[0]) <= 6 && Math.abs(cmp16[ov16 + 1] - RED[1]) <= 6 && Math.abs(cmp16[ov16 + 2] - RED[2]) <= 6;
  var dt16 = layers[0].ctx.getImageData(BODY.x + 5, BODY.y, 1, 1).data;
  var lowAlone16 = Math.abs(dt16[0] - RED[0]) <= 6 && Math.abs(dt16[1] - RED[1]) <= 6 && Math.abs(dt16[2] - RED[2]) <= 6;
  if (one16 && onlyRed16 && lowAlone16) delOk16 = true;
  while (undoStack.length > nBefore16 && undoStack.length > 0) doUndo();
  if (layers.length === 2) {
    var back16 = layers[1].ctx.getImageData(BODY.x + 5, BODY.y, 1, 1).data;
    delUndo16 = Math.abs(back16[0] - GREEN[0]) <= 6 && Math.abs(back16[1] - GREEN[1]) <= 6 && Math.abs(back16[2] - GREEN[2]) <= 6;
    cmp16 = snapWork().data;
    delUndo16 = delUndo16 && Math.abs(cmp16[ov16] - GREEN[0]) <= 6 && Math.abs(cmp16[ov16 + 1] - GREEN[1]) <= 6 && Math.abs(cmp16[ov16 + 2] - GREEN[2]) <= 6;
  }
  /* persist v2 с двумя слоями */
  persistNow();
  var per16 = false, perN16 = 0;
  try {
    var raw16 = localStorage.getItem(KEY);
    var o16 = raw16 ? JSON.parse(raw16) : null;
    if (o16 && o16.v === 2 && o16.layers && o16.layers.length === 2) {
      perN16 = o16.layers.length;
      per16 = o16.layers.every(function (m) { return typeof m.d === 'string' && m.d.indexOf('data:image/png') === 0; });
    }
  } catch (e16) { }
  /* полный откат всего ST16 до границы — картина вернулась байт-в-байт */
  var roll16 = true;
  while (undoStack.length > mark16 && undoStack.length > 0) roll16 = doUndo() && roll16;
  activateLayer(0);
  var clean16 = layers.length === 1;
  var backA16 = dataEqual(snapWork(), A16);
  rec('ST16', twoOk16 && topWin16 && halfOk16 && lowWin16 && swap16 && delOk16 && delUndo16 && per16 && clean16 && roll16 && backA16,
    'слои: 2 ' + twoOk16 + ', верх поверх ' + topWin16 + ', сила 50% лерп ' + halfOk16 + ', скрытие ' + lowWin16 +
    ', перенос ' + swap16 + ', удалить+undo ' + delOk16 + '/' + delUndo16 + ', persist ' + per16 + ' (' + perN16 + '), откат ' + roll16 + '/' + backA16);

  /* ST17: ТАЧ-МАЗОК, ХОТКЕИ ПО ФИЗИЧЕСКОМУ КОДУ (ру-раскладка), ТАБЫ ПАЛИТР */
  var A17 = snapWork();
  var rect17 = work.getBoundingClientRect();
  var sx17 = rect17.left + rect17.width * ((BODY.x + 6) / W);
  var sy17 = rect17.top + rect17.height * (BODY.y / H);
  work.dispatchEvent(new PointerEvent('pointerdown', { pointerId: 401, pointerType: 'touch', clientX: sx17, clientY: sy17, isPrimary: true, bubbles: true }));
  work.dispatchEvent(new PointerEvent('pointermove', { pointerId: 401, pointerType: 'touch', clientX: sx17 + 40, clientY: sy17, isPrimary: true, bubbles: true }));
  work.dispatchEvent(new PointerEvent('pointerup', { pointerId: 401, isPrimary: true, bubbles: true }));
  var touchN17 = 0;
  var B17 = snapWork();
  for (var t17 = 0; t17 < W * H; t17++) if (diffPx(A17, B17, t17) > 0) touchN17++;
  var touchUndo17 = doUndo() && dataEqual(snapWork(), A17);
  /* Ctrl+Z на русской раскладке: физическая KeyZ даёт key='я' — матчинг по e.code */
  strokeLine(BODY.x, BODY.y, BODY.x + 10, BODY.y, { size: 10, hardness: 100, color: '#6fa8ff', opacity: 100 });
  window.dispatchEvent(new KeyboardEvent('keydown', { code: 'KeyZ', key: 'я', ctrlKey: true, bubbles: true, cancelable: true }));
  var hotUndo17 = dataEqual(snapWork(), A17);
  /* табы палитр: выключенная панель реально исчезает (баг hidden vs display:flex) */
  setColorPane('cw');
  var cwH17 = $('paneCW').getBoundingClientRect().height;
  var ownH17 = $('paneOwn').getBoundingClientRect().height;
  setColorPane('own');
  var cwH17b = $('paneCW').getBoundingClientRect().height;
  var ownH17b = $('paneOwn').getBoundingClientRect().height;
  var tabsOk17 = cwH17 > 4 && ownH17 === 0 && cwH17b === 0 && ownH17b > 4;
  rec('ST17', touchN17 > 50 && touchUndo17 && hotUndo17 && tabsOk17,
    'тач: ' + touchN17 + ' px, undo ' + touchUndo17 + '; Ctrl+Z (code=KeyZ/key=я): ' + hotUndo17 +
    '; табы корректны ' + tabsOk17 + ' (cw ' + Math.round(cwH17) + '→' + Math.round(cwH17b) + ', свой ' + Math.round(ownH17) + '→' + Math.round(ownH17b) + ')');
  setColorPane('own');

  /* ST18: НАЛОЖЕНИЕ СЛОЁВ (blend modes) + мини-предпросмотры в списке */
  var n18 = layers.length;
  var lowBefore18 = layers[0].ctx.getImageData(0, 0, W, H);
  addLayerUI();                                    /* верхний слой, активен */
  var added18 = layers.length === n18 + 1 && activeLy === layers.length - 1;
  strokeLine(BODY.x, BODY.y, BODY.x + 14, BODY.y, { size: 12, hardness: 100, color: '#00cc44', opacity: 100 });
  var top18 = layers.length - 1;
  var G18 = [0, 204, 68];                          /* #00cc44 */
  var ov18 = (BODY.y * W + BODY.x + 7) * 4;
  var bd18 = baseImageData.data;
  var bp18 = [bd18[ov18], bd18[ov18 + 1], bd18[ov18 + 2]];
  pushStructUndo();
  setLayerMode(top18, 'multiply');
  var cmp18 = snapWork().data;
  var mulOk18 = Math.abs(cmp18[ov18] - G18[0] * bp18[0] / 255) <= 8 &&
    Math.abs(cmp18[ov18 + 1] - G18[1] * bp18[1] / 255) <= 8 &&
    Math.abs(cmp18[ov18 + 2] - G18[2] * bp18[2] / 255) <= 8;
  var modeUndo18 = doUndo() && layers[top18].mode === 'source-over';
  setLayerMode(top18, 'screen');
  cmp18 = snapWork().data;
  var scrOk18 = true;
  for (var ch18 = 0; ch18 < 3; ch18++) {
    var exp18 = 255 - (255 - G18[ch18]) * (255 - bp18[ch18]) / 255;
    if (Math.abs(cmp18[ov18 + ch18] - exp18) > 8) scrOk18 = false;
  }
  setLayerMode(top18, 'overlay');
  var selOk18 = $('layerMode').value === 'overlay';
  persistNow();
  var per18 = false;
  try {
    var po18 = JSON.parse(localStorage.getItem(KEY));
    per18 = !!(po18 && po18.layers[top18] && po18.layers[top18].m === 'overlay');
  } catch (err18) { }
  /* мини-предпросмотры: по канвасу на слой; зелень видна в верхнем,
     нижний слой пуст — только шахматка */
  renderLayers();
  var th18 = $('layerList').querySelectorAll('canvas.lyth');
  var thCount18 = th18.length === layers.length;
  var topTh18 = th18[0].getContext('2d').getImageData(0, 0, 42, 28).data;
  var greenN18 = 0;
  for (var g18 = 0; g18 < 42 * 28; g18++) {
    var o18 = g18 * 4;
    if (topTh18[o18 + 3] > 0 && topTh18[o18 + 1] > topTh18[o18] + 30 && topTh18[o18 + 1] > topTh18[o18 + 2] + 30) greenN18++;
  }
  var botTh18 = th18[th18.length - 1].getContext('2d').getImageData(0, 0, 42, 28).data;
  var botInk18 = 0;
  for (var b18 = 3; b18 < botTh18.length; b18 += 4) if (botTh18[b18] > 0) botInk18++;
  /* ST18 работает только с верхним слоем: нижний должен остаться
     байт-в-байт как был (гейт независим от мусора в localStorage) */
  var lowAfter18 = layers[0].ctx.getImageData(0, 0, W, H);
  var lowSame18 = dataEqual(lowBefore18, lowAfter18);
  rec('ST18', added18 && mulOk18 && modeUndo18 && scrOk18 && selOk18 && per18 && thCount18 && greenN18 > 0 && lowSame18,
    'наложение: слой добавлен ' + added18 + ', multiply=SD/255 ' + mulOk18 + ', undo-режим ' + modeUndo18 +
    ', screen ' + scrOk18 + ', селект=overlay ' + selOk18 + ', persist ' + per18 +
    '; мини: слоёв ' + th18.length + '/' + layers.length + ', зелень в верхнем ' + greenN18 + ' px, нижний нетронут ' + lowSame18 + ' (чернила ' + botInk18 + ')');

  /* финал: один чистый слой, стеки пусты */
  undoStack.length = 0; redoStack.length = 0;
  if (layers.length !== 1 || pctx.getImageData(0, 0, 1, 1).data[3] !== 0) {
    layers = [mkLayer()]; activeLy = 0; syncActiveAlias(); renderLayers();
  }
  pctx.clearRect(0, 0, W, H);
  composite(); persistNow(); updateUndoUI();

  document.getElementById('selftest').textContent =
    lines.join('\n') + '\n' + (pass === total ? 'PASS ' + pass + '/' + total : 'FAILED ' + pass + '/' + total);
  document.getElementById('selftest').style.display = 'block';
}

/* ---------- инициализация ---------- */
function ready() {
  buildBase();
  composite();
  tryRestore();
  renderHistory();
  renderLayers();
  updateUndoUI();
  setSize(state.size);
  drawBrushPrev();
}
assets.base.onload = ready;
assets.base.onerror = function () { };

setColor('#f5e5ce', true);
drawSV(); drawHue();
if (/[?&]selftest=1/.test(location.search)) {
  var stWait = setInterval(function () {
    if (silArr) { clearInterval(stWait); runSelfTest(); }
  }, 100);
  setTimeout(function () { clearInterval(stWait); }, 10000);
}

window.PAINT = {
  W: W, H: H,
  state: state,
  assets: assets,
  work: work,
  paintCanvas: function () { return paintCv; },      /* канвас АКТИВНОГО слоя */
  layers: function () { return layers.slice(); },    /* [ {name, visible, opacity, cv, ctx, id} ] */
  activeLayer: function () { return activeLy; },
  addLayer: function () { addLayerUI(); return activeLy; },
  deleteLayer: function () { delLayerUI(); },
  activateLayer: function (i) { activateLayer(i); },
  setLayerVisible: setLayerVisible,
  setLayerOpacity: setLayerOpacity,
  setLayerMode: setLayerMode,
  layerMode: function () { return layers[activeLy].mode; },
  layerModes: function () { return LAYER_MODES.map(function (m) { return m.slice(); }); },
  moveLayer: function (dir) { moveLayerUI(dir); },
  mergeDown: function () { mergeDownUI(); },
  exportFlatCanvas: exportFlatCanvas,
  liveCanvas: function () { return liveCv; },
  baseImageData: function () { return baseImageData; },
  stroke: strokeLine,
  liveBegin: liveBegin, liveMove: liveMove, liveEnd: liveEnd,
  activePointer: function () { return activePtr; },
  floodFill: floodFillAt,
  pickAt: pickAt,
  undo: doUndo, redo: doRedo,
  clearPaint: clearPaint,
  setColor: setColor,
  setBrush: setBrush,
  setSize: setSize,
  history: function () { return history.slice(); },
  composite: composite,
  persistNow: persistNow,
  masks: { sil: function () { return silArr; }, dark: function () { return darkArr; }, cap: function () { return alphaCap; } },
  setColorPane: setColorPane,
  cwPalettes: function () { return CW_PALETTES.slice(); },
  importLayer: importLayer,
  exportGameCanvas: exportGameCanvas,
  exportGameDataURL: exportGameDataURL,
  silhouetteBBox: silhouetteBBox,
  lastToast: function () { return lastToastMsg; },
  toast: toast,
  runSelfTest: runSelfTest
};
})();
</script>
</body>
