name: KNS Paint на paint.phainonsmilk.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kns-deploy
  cancel-in-progress: false

jobs:
  vps:
    name: Статика на VPS
    runs-on: ubuntu-latest
    steps:
      # SHA-пин вместо плавающего тега v4 (конвенция org gertha-puzik)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Гейт — прямой пуш в main не деплоится (kns-main-guard)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python3 tools/main_guard.py gate "$SHA"
      - name: Заливка каталога www
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: 89.232.184.77
          SSH_USER: deploy
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ]; then
            echo "секрет VPS_SSH_KEY пуст" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '89.232.184.77 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDxM5G0ydWqnLcTcPAPUWYgBRspDlaV1oQzkUO2lJzNF' >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          if ! $SSH "$SSH_USER@$SSH_HOST" "mkdir -p /opt/kns/www && test -w /opt/kns/www"; then
            echo "нет записи в /opt/kns/www. Один раз от root: mkdir, chown deploy:deploy. См. README." >&2
            exit 1
          fi
          # --delete только внутри www. .git и .github на сервер не попадают.
          # skills/, tools/ (QC-гейт мерджа), agent-файлы (AGENTS.md, .cursor,
          # .gitignore) и KNS-CONTEXT.md (досье) — только в репо, наружу не выкладываются.
          rsync -az --delete --exclude='.git' --exclude='.github' --exclude='KNS-CONTEXT.md' --exclude='skills' --exclude='tools' --exclude='AGENTS.md' --exclude='.gitignore' --exclude='.cursor' \
            -e "$SSH" ./ \
            "$SSH_USER@$SSH_HOST:/opt/kns/www/"
          $SSH "$SSH_USER@$SSH_HOST" "chmod -R a+rX /opt/kns/www"
          echo "статика KNS обновлена в /opt/kns/www; nginx перечитывать не нужно (чистая статика)."
